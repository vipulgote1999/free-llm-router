name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        # If you don't have CLOUDFLARE_ACCOUNT_ID secret, remove that line —
        # wrangler will infer it from the token. Keep apiToken required.
      - name: Smoke — health
        run: |
          sleep 15
          curl -fsS https://free-llm-router.vipulgote5.workers.dev/health | jq .
          curl -fsS https://free-llm-router.vipulgote5.workers.dev/v1/models | jq '.data | length'
